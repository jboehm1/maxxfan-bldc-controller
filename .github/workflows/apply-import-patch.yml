name: Apply imported patch

on:
  push:
    paths:
      - '.import/patch/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .import/patch/READY ]]; then
            exit 0
          fi
          cat .import/patch/*.part > /tmp/change.patch
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          rm -rf .import/patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply imported branch patch'
          git push
