name: Restore exact known-good main
on:
  push:
    paths:
      - '.github/workflows/restore-known-good-main.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore exact historical v0.3.7 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            Path('firmware/MaxxFan_MKS_ESP32_FOC_Mega/MaxxFan_MKS_ESP32_FOC_Mega.ino'),
            Path('reference/v0.3.7-known-good/MaxxFan_v0.3.7_TEST_known_good.ino'),
          ]
          bad = 'if (millis() - waitStart >= START_WAIT_LIMIT_MS) { {'
          good = 'if (millis() - waitStart >= START_WAIT_LIMIT_MS) {'
          for p in files:
            s = p.read_text()
            if s.count(bad) != 1:
              raise SystemExit(f'{p}: expected exactly one corrupted brace, got {s.count(bad)}')
            p.write_text(s.replace(bad, good, 1))
          PY
          expected=c819c768680506cb476243e6bdabd0ec5bdfb79f
          a=$(git hash-object firmware/MaxxFan_MKS_ESP32_FOC_Mega/MaxxFan_MKS_ESP32_FOC_Mega.ino)
          b=$(git hash-object reference/v0.3.7-known-good/MaxxFan_v0.3.7_TEST_known_good.ino)
          echo "firmware blob=$a"
          echo "reference blob=$b"
          test "$a" = "$expected"
          test "$b" = "$expected"
          git diff --check
      - name: Commit restoration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/MaxxFan_MKS_ESP32_FOC_Mega/MaxxFan_MKS_ESP32_FOC_Mega.ino reference/v0.3.7-known-good/MaxxFan_v0.3.7_TEST_known_good.ino
          git commit -m 'fix: restore exact known-good v0.3.7 source'
          git push origin HEAD:main
