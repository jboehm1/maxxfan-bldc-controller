name: Import firmware chunks

on:
  push:
    paths:
      - '.import/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble requested imports
        shell: bash
        run: |
          set -euo pipefail
          TARGET='firmware/MaxxFan_MKS_ESP32_FOC_Mega/MaxxFan_MKS_ESP32_FOC_Mega.ino'
          REF='reference/v0.3.7-known-good/MaxxFan_v0.3.7_TEST_known_good.ino'

          if [[ -f .import/main_fw/READY ]]; then
            mkdir -p "$(dirname "$TARGET")" "$(dirname "$REF")"
            cat .import/main_fw/*.part > "$TARGET"
            cp "$TARGET" "$REF"
            rm -rf .import/main_fw
          fi

          if [[ -f .import/develop_fw/READY ]]; then
            mkdir -p "$(dirname "$TARGET")"
            cat .import/develop_fw/*.part > "$TARGET"
            rm -rf .import/develop_fw
          fi

          if [[ -f .import/dynamic_fw/READY ]]; then
            mkdir -p "$(dirname "$TARGET")"
            cat .import/dynamic_fw/*.part > "$TARGET"
            rm -rf .import/dynamic_fw
          fi

          if git diff --quiet && git diff --cached --quiet; then
            echo 'Nothing to assemble.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble imported firmware source'
          git push
